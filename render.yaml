services:
  - type: web
    name: studynest
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
    disk:
      name: studynest-data
      mountPath: /var/data
      sizeGB: 1
